<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itsuka</title>
<!-- The tab icon, the home screen icon and the settings file for adding the site to a phone -->
<meta name="theme-color" content="#1F3A2E">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Itsuka">
<!-- The pixel font is hosted with the site, fetching it early makes the lettering appear sooner -->
<link rel="preload" href="fonts/pixelify-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>

<!-- The checking class hides the page until member.js knows who is signed in -->
<body class="checking">

<!-- The moving background is drawn onto this canvas by backgrounds.js -->
<canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>

<!-- The top of the page: The title the two buttons -->
<header class="top">
  <h1><a href="index.html">Itsuka</a></h1>
  <div class="top-actions">
    <button class="plain-button" id="sceneButton" type="button">Settings</button>
    <!-- The signed-in member's card. Hidden until member.js knows who is signed in -->
    <button class="member-chip" id="memberChip" type="button" hidden>
      <canvas class="chip-photo" id="chipPhoto" aria-hidden="true"></canvas>
      <span id="chipName"></span>
    </button>
  </div>
</header>

<!-- The search box, tucked away until the Find button is pressed -->
<div class="search-line" id="searchLine" hidden>
  <label class="visually-hidden" for="searchBox">Find a book</label>
  <input class="search-box" id="searchBox" type="search" maxlength="80" autocomplete="off" placeholder="Find a book by name or notes">
</div>

<!-- The Find button, the Hide done switch, the Pull a book button and the plaques (one switch per section), the plaques and the shelves are both built by library.js -->
<div class="tabs-row">
  <button class="plain-button find-button" id="findButton" type="button" aria-expanded="false" aria-controls="searchLine" hidden>Find</button>
  <button class="plain-button done-switch" id="doneSwitch" type="button" aria-pressed="false" hidden>Hide done</button>
  <button class="plain-button pull-button" id="pullButton" type="button" hidden>Pull a book</button>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>
<!-- A red message box for when the shelves cannot be loaded -->
<p class="library-note" id="libraryNote" role="alert" hidden></p>
<main class="sections" id="library"></main>

<!-- The developer tag at the bottom of the page -->
<footer class="credit">Developed By Sav</footer>

<!-- The settings: the background for this device (thumbnails added by backgrounds.js) and the shelf tools for this member (switches added by library.js) -->
<dialog class="scenes" id="scenePicker" aria-labelledby="sceneTitle">
  <div class="scenes-inner">
    <div class="scenes-head">
      <h2 id="sceneTitle">Settings</h2>
      <button class="plain-button" id="sceneDone" type="button">Done</button>
    </div>
    <h3 class="settings-title">Background on this device</h3>
    <label class="motion-switch">
      <input type="checkbox" id="motionSwitch"> Moving backgrounds
    </label>
    <div class="scene-list" id="sceneList"></div>
    <h3 class="settings-title">On the shelves</h3>
    <div class="settings-list" id="settingsList"></div>
    <p class="settings-note" id="settingsNote" role="alert" hidden></p>
    <h3 class="settings-title">Your library</h3>
    <div class="library-copy">
      <button class="plain-button" id="downloadCopy" type="button">Download a copy</button>
      <button class="plain-button" id="loadCopy" type="button">Load a copy</button>
      <input id="copyFile" type="file" accept=".json,application/json" hidden>
    </div>
    <p class="library-status" id="libraryStatus" role="status" hidden></p>
  </div>
</dialog>

<button class="add-button" id="addBook" type="button">+ Add a book</button>

<!-- The catalogue card-->
<dialog class="card-dialog" id="catalogueDialog" aria-labelledby="catalogueTitle">
  <div class="card-shadow">
    <form class="member-card catalogue-card" id="catalogueForm" novalidate>
      <div class="catalogue-head">
        <h2 id="catalogueTitle">Add a book</h2>
        <span class="card-kind">Catalogue card</span>
      </div>
      <div class="card-body">
        <p class="card-note" id="catalogueNote" role="alert" hidden></p>
        <label class="card-line">
          <span>Name</span>
          <input id="bookName" type="text" maxlength="80" autocomplete="off">
        </label>
        <label class="card-line">
          <span>Link</span>
          <input id="bookLink" type="text" maxlength="2000" inputmode="url" autocapitalize="off" spellcheck="false" autocomplete="off" placeholder="instagram.com/someone">
        </label>
        <label class="card-line">
          <span>Section</span>
          <select id="bookSection"></select>
        </label>
        <label class="card-line" id="newSectionLine" hidden>
          <span>New section</span>
          <input id="newSectionName" type="text" maxlength="40" autocomplete="off">
        </label>
        <label class="card-notes">
          <span>Notes, one point per line</span>
          <textarea id="bookNotes" rows="4" maxlength="10000"></textarea>
        </label>
        <div class="picture-row">
          <canvas class="picture-thumb" id="bookPicturePreview" aria-hidden="true" hidden></canvas>
          <div class="picture-choices">
            <label class="link-button file-pick"><span id="bookPictureLabel">Choose a picture</span><input id="bookPictureFile" type="file" accept="image/*"></label>
            <button class="link-button" id="bookPictureRemove" type="button" hidden>Remove picture</button>
          </div>
        </div>
        <button class="card-button" id="catalogueSubmit" type="submit">Add to shelf</button>
        <p class="card-switch card-ends">
          <button class="link-button" id="catalogueCancel" type="button">Cancel</button>
          <button class="link-button danger-link" id="bookDelete" type="button" hidden>Delete book</button>
        </p>
      </div>
      <div class="catalogue-hole" aria-hidden="true"></div>
    </form>
  </div>
</dialog>

<!-- The sections card: Rename, move, sort, share and delete sections and add new ones. The rows are built by library.js -->
<dialog class="card-dialog" id="sectionsDialog" aria-labelledby="sectionsTitle">
  <div class="card-shadow">
    <div class="member-card catalogue-card">
      <div class="catalogue-head">
        <h2 id="sectionsTitle">Sections</h2>
        <span class="card-kind">Shelf plaques</span>
      </div>
      <div class="card-body">
        <p class="card-note" id="sectionsNote" role="alert" hidden></p>
        <div id="sectionRows"></div>
        <form class="card-line section-row" id="sectionAddForm" novalidate>
          <input id="sectionAddName" type="text" maxlength="40" autocomplete="off" placeholder="New section name" aria-label="New section name">
          <button class="link-button" type="submit">Add</button>
        </form>
        <button class="card-button" id="sectionsDone" type="button">Done</button>
      </div>
      <div class="catalogue-hole" aria-hidden="true"></div>
    </div>
  </div>
</dialog>

<!-- The share card: a private link to one shelf, filled in by library.js -->
<dialog class="card-dialog" id="shareDialog" aria-labelledby="shareTitle">
  <div class="card-shadow">
    <div class="member-card catalogue-card">
      <div class="catalogue-head">
        <h2 id="shareTitle">Share a shelf</h2>
        <span class="card-kind">Lending slip</span>
      </div>
      <div class="card-body">
        <p class="card-note" id="shareNote" role="alert" hidden></p>
        <p class="share-about" id="shareAbout"></p>
        <label class="card-line share-link" id="shareLinkLine" hidden>
          <span class="visually-hidden">Link to this shelf</span>
          <input id="shareLink" type="text" readonly spellcheck="false">
        </label>
        <button class="card-button" id="shareMake" type="button">Make a link</button>
        <div class="share-actions" id="shareActions" hidden>
          <button class="card-button" id="shareCopy" type="button">Copy link</button>
          <button class="card-button" id="shareSend" type="button" hidden>Send</button>
        </div>
        <p class="card-switch card-ends">
          <button class="link-button" id="shareClose" type="button">Back</button>
          <button class="link-button danger-link" id="shareStop" type="button" hidden>Stop sharing</button>
        </p>
      </div>
      <div class="catalogue-hole" aria-hidden="true"></div>
    </div>
  </div>
</dialog>

<!-- Deletion confermation message shown before anything is deleted -->
<dialog class="card-dialog" id="confirmDialog" aria-labelledby="confirmMessage">
  <div class="card-shadow">
    <div class="member-card catalogue-card">
      <div class="card-body">
        <p class="confirm-message" id="confirmMessage"></p>
        <button class="card-button danger" id="confirmYes" type="button">Delete</button>
        <p class="card-switch"><button class="link-button" id="confirmNo" type="button" autofocus>Keep it</button></p>
      </div>
    </div>
  </div>
</dialog>

<!-- The member's full card that can be opened from the small card in the corner -->
<dialog class="card-dialog" id="memberDialog" aria-labelledby="memberTitle">
  <div class="card-shadow">
    <div class="member-card">
      <div class="card-band">
        <span class="card-name">Itsuka</span>
        <span class="card-kind">Library card</span>
      </div>
      <div class="card-body">
        <h2 id="memberTitle">Your card</h2>
        <p class="card-note" id="photoNote" role="alert" hidden></p>
        <div class="card-top">
          <canvas class="card-photo" id="memberPhoto" aria-hidden="true"></canvas>
          <div>
            <div class="card-line"><span>Name</span><b id="memberName"></b></div>
            <div class="card-line"><span>Member since</span><b id="memberSince"></b></div>
          </div>
        </div>
        <div class="card-line"><span>Email</span><b id="memberEmail"></b></div>
        <div class="picture-choices">
          <label class="link-button file-pick"><span id="photoPickLabel">Add a photo</span><input id="photoFile" type="file" accept="image/*"></label>
          <button class="link-button" id="photoRemove" type="button" hidden>Remove photo</button>
        </div>
        <button class="card-button" id="signOut" type="button">Sign out</button>
        <p class="card-switch"><button class="link-button" id="memberClose" type="button" autofocus>Close</button></p>
      </div>
      <div class="card-foot" aria-hidden="true">
        <div class="barcode"></div>
        <span class="card-number" id="memberNumber"></span>
      </div>
    </div>
  </div>
</dialog>

<script src="backgrounds.js"></script>
<!-- The Supabase library, pinned to one exact version so an update cannot change how the site behaves -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="pictures.js"></script>
<script src="shelves.js"></script>
<script src="member.js"></script>
<script src="library.js"></script>

</body>
</html>
